name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-22.04

    env:
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      PIP_NO_INPUT: "1"

    steps:

      # ============================================
      # CHECKOUT
      # ============================================
      - name: Checkout repository
        uses: actions/checkout@v4

      # ============================================
      # PYTHON 3.12
      # ============================================
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # ============================================
      # JAVA 17
      # ============================================
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # ============================================
      # VERIFY PYTHON + JAVA
      # ============================================
      - name: Verify Python and Java
        run: |
          set -e

          echo "========================================"
          echo "PYTHON"
          echo "========================================"

          python --version
          python -m pip --version

          echo ""
          echo "========================================"
          echo "JAVA"
          echo "========================================"

          echo "JAVA_HOME=$JAVA_HOME"

          java -version
          javac -version

      # ============================================
      # SYSTEM DEPENDENCIES
      # ============================================
      - name: Install system dependencies
        run: |
          set -e

          sudo apt-get update

          sudo apt-get install -y \
            build-essential \
            git \
            zip \
            unzip \
            wget \
            curl \
            autoconf \
            automake \
            autopoint \
            ccache \
            cmake \
            libffi-dev \
            libltdl-dev \
            libssl-dev \
            libtool \
            make \
            patch \
            pkg-config \
            patchelf \
            gettext

      # ============================================
      # ANDROID SDK
      # ============================================
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      # ============================================
      # DETECT SDKMANAGER
      # ============================================
      - name: Detect Android SDK manager
        shell: bash
        run: |
          set -e

          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" \
            -type f \
            -name sdkmanager \
            -print \
            -quit)"

          if [ -z "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager was not found."

            find "$ANDROID_HOME/cmdline-tools" \
              -maxdepth 5 \
              -type f \
              -print || true

            exit 1
          fi

          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"

          echo ""
          echo "Found sdkmanager:"
          echo "$SDKMANAGER"

          echo ""
          echo "sdkmanager version:"
          "$SDKMANAGER" --version

      # ============================================
      # ACCEPT LICENSES
      # ============================================
      - name: Accept Android SDK licenses
        shell: bash
        run: |
          yes | "$SDKMANAGER" --licenses > /dev/null || true

      # ============================================
      # INSTALL ANDROID SDK
      # ============================================
      - name: Install Android SDK packages
        shell: bash
        run: |
          set -e

          echo "Installing platform-tools..."

          "$SDKMANAGER" \
            --sdk_root="$ANDROID_HOME" \
            "platform-tools"

          echo ""
          echo "Installing Android API 35..."

          "$SDKMANAGER" \
            --sdk_root="$ANDROID_HOME" \
            "platforms;android-35"

          echo ""
          echo "Installing Build Tools 35.0.0..."

          "$SDKMANAGER" \
            --sdk_root="$ANDROID_HOME" \
            "build-tools;35.0.0"

          echo ""
          echo "Android SDK installation complete."

      # ============================================
      # VERIFY ANDROID SDK
      # ============================================
      - name: Verify Android SDK
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "ANDROID SDK"
          echo "========================================"

          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

          echo ""
          echo "Platform tools:"
          ls -la "$ANDROID_HOME/platform-tools"

          echo ""
          echo "Android API 35:"
          ls -la "$ANDROID_HOME/platforms/android-35"

          echo ""
          echo "Build Tools:"
          ls -la "$ANDROID_HOME/build-tools/35.0.0"

          echo ""
          echo "Testing AIDL..."

          test -x \
            "$ANDROID_HOME/build-tools/35.0.0/aidl"

          "$ANDROID_HOME/build-tools/35.0.0/aidl" \
            --help > /dev/null

          echo "AIDL is working."

      # ============================================
      # INSTALL BUILDOZER
      #
      # Keep Python 3.12.
      # Use Cython version recommended for p4a master.
      # ============================================
      - name: Install Buildozer
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "INSTALL BUILDOZER"
          echo "========================================"

          python -m pip install \
            "pip==25.3"

          python -m pip install \
            "buildozer==1.6.0"

          python -m pip install \
            "setuptools" \
            "cython==0.29.34" \
            "virtualenv"

          echo ""
          echo "Python:"
          python --version

          echo ""
          echo "pip:"
          python -m pip --version

          echo ""
          echo "Buildozer:"
          buildozer --version

          echo ""
          echo "Cython:"
          cython --version

      # ============================================
      # CHECK BUILD SPEC
      # ============================================
      - name: Validate buildozer.spec
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "BUILDOZER SPEC"
          echo "========================================"

          if [ ! -f buildozer.spec ]; then
            echo "ERROR: buildozer.spec not found."
            exit 1
          fi

          cat buildozer.spec

          echo ""
          echo "Checking requirements..."

          REQUIREMENTS_LINE="$(grep -E \
            '^[[:space:]]*requirements[[:space:]]*=' \
            buildozer.spec || true)"

          echo "$REQUIREMENTS_LINE"

          if echo "$REQUIREMENTS_LINE" | \
             grep -E '(^|,)[[:space:]]*android[[:space:]]*(,|$)'; then

            echo ""
            echo "ERROR: 'android' must not be in requirements."
            exit 1
          fi

          echo ""
          echo "Checking p4a branch..."

          P4A_BRANCH="$(grep -E \
            '^[[:space:]]*p4a\.branch[[:space:]]*=' \
            buildozer.spec || true)"

          echo "$P4A_BRANCH"

          if ! echo "$P4A_BRANCH" | grep -q "master"; then
            echo ""
            echo "ERROR: p4a.branch must be master."
            exit 1
          fi

          echo ""
          echo "Buildozer configuration looks correct."

      # ============================================
      # CLEAN BUILDOZER
      # ============================================
      - name: Clean Buildozer environment
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "CLEAN BUILDOZER"
          echo "========================================"

          rm -rf "$HOME/.buildozer"
          rm -rf ".buildozer"

          mkdir -p "$HOME/.buildozer/android/platform"

          echo "Buildozer directories prepared."

      # ============================================
      # CONFIGURE BUILDOZER SDK
      # ============================================
      - name: Configure Buildozer Android SDK
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "CONFIGURE BUILDOZER SDK"
          echo "========================================"

          BUILDOZER_PLATFORM="$HOME/.buildozer/android/platform"
          BUILDOZER_SDK="$BUILDOZER_PLATFORM/android-sdk"

          rm -rf "$BUILDOZER_SDK"

          ln -s \
            "$ANDROID_HOME" \
            "$BUILDOZER_SDK"

          echo ""
          echo "Buildozer SDK:"
          ls -la "$BUILDOZER_PLATFORM"

          # Buildozer 1.6 compatibility path
          mkdir -p "$ANDROID_HOME/tools/bin"

          ln -sf \
            "$SDKMANAGER" \
            "$ANDROID_HOME/tools/bin/sdkmanager"

          mkdir -p "$BUILDOZER_SDK/tools/bin"

          ln -sf \
            "$SDKMANAGER" \
            "$BUILDOZER_SDK/tools/bin/sdkmanager"

          echo ""
          echo "Buildozer sdkmanager:"
          "$BUILDOZER_SDK/tools/bin/sdkmanager" --version

      # ============================================
      # PREPARE p4a MASTER
      #
      # Buildozer will clone the branch specified
      # in buildozer.spec.
      # ============================================
      - name: Verify p4a master configuration
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "p4a CONFIGURATION"
          echo "========================================"

          grep -n \
            "p4a.branch" \
            buildozer.spec

          echo ""
          echo "Python runner:"
          python --version

          echo ""
          echo "Expected configuration:"
          echo "Python 3.12"
          echo "p4a master"
          echo "Cython 0.29.34"

      # ============================================
      # BUILD APK
      # ============================================
      - name: Build APK
        shell: bash
        env:
          JAVA_HOME: ${{ env.JAVA_HOME }}
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
          ANDROID_SDK_ROOT: ${{ env.ANDROID_SDK_ROOT }}

        run: |
          set -e

          echo "========================================"
          echo "BUILD ENVIRONMENT"
          echo "========================================"

          echo ""
          echo "Python:"
          python --version

          echo ""
          echo "pip:"
          python -m pip --version

          echo ""
          echo "Buildozer:"
          buildozer --version

          echo ""
          echo "Java:"
          java -version

          echo ""
          echo "JAVA_HOME:"
          echo "$JAVA_HOME"

          echo ""
          echo "ANDROID_HOME:"
          echo "$ANDROID_HOME"

          echo ""
          echo "ANDROID_SDK_ROOT:"
          echo "$ANDROID_SDK_ROOT"

          echo ""
          echo "========================================"
          echo "STARTING BUILDOZER"
          echo "========================================"

          buildozer -v android debug

      # ============================================
      # VERIFY APK
      # ============================================
      - name: Verify APK
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "VERIFY APK"
          echo "========================================"

          find . \
            -type f \
            -name "*.apk" \
            -print

          APK_COUNT=$(find . -type f -name "*.apk" | wc -l)

          if [ "$APK_COUNT" -eq 0 ]; then
            echo ""
            echo "ERROR: APK was not created."
            exit 1
          fi

          echo ""
          echo "APK COUNT: $APK_COUNT"
          echo "APK successfully created."

      # ============================================
      # UPLOAD APK
      # ============================================
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: weatherapp-apk
          path: bin/*.apk
          if-no-files-found: error