name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-22.04

    env:
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      PIP_NO_INPUT: "1"
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:

      # ============================================
      # CHECKOUT
      # ============================================
      - name: Checkout repository
        uses: actions/checkout@v4

      # ============================================
      # PYTHON 3.12 - BUILD HOST
      # ============================================
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # ============================================
      # JAVA 17
      # ============================================
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # ============================================
      # VERIFY HOST ENVIRONMENT
      # ============================================
      - name: Verify host environment
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "HOST ENVIRONMENT"
          echo "========================================"

          echo "Python:"
          python --version
          python -c "import sys; print(sys.executable)"
          python -c "import sys; print(sys.version)"

          echo ""
          echo "Java:"
          java -version
          javac -version

          echo ""
          echo "JAVA_HOME:"
          echo "$JAVA_HOME"

          echo ""
          echo "ANDROID_HOME:"
          echo "$ANDROID_HOME"

      # ============================================
      # SYSTEM DEPENDENCIES
      # ============================================
      - name: Install system dependencies
        shell: bash
        run: |
          set -e

          sudo apt-get update

          sudo apt-get install -y \
            build-essential \
            git \
            zip \
            unzip \
            wget \
            curl \
            autoconf \
            automake \
            autopoint \
            ccache \
            cmake \
            libffi-dev \
            libltdl-dev \
            libssl-dev \
            libtool \
            make \
            patch \
            pkg-config \
            patchelf \
            gettext

      # ============================================
      # ANDROID SDK
      # ============================================
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      # ============================================
      # INSTALL ANDROID COMPONENTS
      # ============================================
      - name: Install Android SDK packages
        shell: bash
        run: |
          set -e

          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" \
            -type f \
            -name sdkmanager \
            -print \
            -quit)"

          if [ -z "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager not found."
            exit 1
          fi

          echo "Using sdkmanager:"
          echo "$SDKMANAGER"

          yes | "$SDKMANAGER" --licenses > /dev/null || true

          "$SDKMANAGER" \
            --sdk_root="$ANDROID_HOME" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      # ============================================
      # VERIFY AIDL
      # ============================================
      - name: Verify Android SDK and AIDL
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "ANDROID SDK CHECK"
          echo "========================================"

          test -d "$ANDROID_HOME/platforms/android-35"
          test -d "$ANDROID_HOME/build-tools/35.0.0"

          AIDL="$ANDROID_HOME/build-tools/35.0.0/aidl"

          if [ ! -x "$AIDL" ]; then
            echo "ERROR: AIDL not found:"
            echo "$AIDL"
            exit 1
          fi

          "$AIDL" --help > /dev/null

          echo "AIDL is working."

      # ============================================
      # INSTALL BUILDOZER
      # ============================================
      - name: Install Buildozer
        shell: bash
        run: |
          set -e

          python -m pip install --upgrade pip

          python -m pip install \
            "buildozer==1.6.0"

          python -m pip install \
            "setuptools" \
            "virtualenv"

          echo ""
          echo "Buildozer:"
          buildozer --version

      # ============================================
      # CHECK BUILDOZER SPEC
      # ============================================
      - name: Validate buildozer.spec
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "BUILDOZER SPEC"
          echo "========================================"

          if [ ! -f buildozer.spec ]; then
            echo "ERROR: buildozer.spec not found."
            exit 1
          fi

          cat buildozer.spec

          echo ""
          echo "Requirements:"
          grep -E \
            '^[[:space:]]*requirements[[:space:]]*=' \
            buildozer.spec || true

          echo ""
          echo "p4a configuration:"
          grep -E \
            '^[[:space:]]*p4a\.(branch|commit|fork|url)[[:space:]]*=' \
            buildozer.spec || true

      # ============================================
      # CLEAN PREVIOUS BUILDS
      # ============================================
      - name: Clean Buildozer environment
        shell: bash
        run: |
          set -e

          echo "Cleaning previous Buildozer state..."

          rm -rf "$HOME/.buildozer"
          rm -rf ".buildozer"
          rm -rf "bin"

          echo "Clean complete."

      # ============================================
      # CONFIGURE BUILDOZER SDK
      # ============================================
      - name: Configure Buildozer Android SDK
        shell: bash
        run: |
          set -e

          BUILDOZER_PLATFORM="$HOME/.buildozer/android/platform"
          BUILDOZER_SDK="$BUILDOZER_PLATFORM/android-sdk"

          mkdir -p "$BUILDOZER_PLATFORM"

          rm -rf "$BUILDOZER_SDK"

          ln -s \
            "$ANDROID_HOME" \
            "$BUILDOZER_SDK"

          echo "Buildozer Android SDK:"
          ls -la "$BUILDOZER_PLATFORM"

          echo ""
          echo "SDK link:"
          readlink -f "$BUILDOZER_SDK"

      # ============================================
      # BUILD
      # ============================================
      - name: Build APK
        shell: bash
        env:
          JAVA_HOME: ${{ env.JAVA_HOME }}
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
          ANDROID_SDK_ROOT: ${{ env.ANDROID_SDK_ROOT }}

        run: |
          set -e

          echo "========================================"
          echo "BUILD ENVIRONMENT"
          echo "========================================"

          python --version
          python -m pip --version
          buildozer --version
          java -version

          echo ""
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

          echo ""
          echo "========================================"
          echo "STARTING BUILD"
          echo "========================================"

          buildozer -v android debug

      # ============================================
      # VERIFY APK
      # ============================================
      - name: Verify APK
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "APK CHECK"
          echo "========================================"

          find . \
            -type f \
            -name "*.apk" \
            -print

          APK_COUNT=$(find . -type f -name "*.apk" | wc -l)

          if [ "$APK_COUNT" -eq 0 ]; then
            echo "ERROR: No APK was created."
            exit 1
          fi

          echo ""
          echo "APK COUNT: $APK_COUNT"
          echo "APK successfully created."

      # ============================================
      # UPLOAD APK
      # ============================================
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: weatherapp-apk
          path: bin/*.apk
          if-no-files-found: error