name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-22.04

    env:
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      PIP_NO_INPUT: "1"
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      JAVA_HOME: /opt/hostedtoolcache/Java_Temurin-Hotspot_jdk/17.0.20-8/x64

    steps:

      # ============================================
      # CHECKOUT
      # ============================================
      - name: Checkout repository
        uses: actions/checkout@v4

      # ============================================
      # PYTHON 3.12
      # ============================================
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # ============================================
      # JAVA 17
      # ============================================
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # ============================================
      # VERIFY PYTHON / JAVA
      # ============================================
      - name: Verify environment
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "PYTHON"
          echo "========================================"

          python --version
          python -c "import sys; print(sys.executable)"
          python -c "import sys; print(sys.version)"

          echo ""
          echo "========================================"
          echo "JAVA"
          echo "========================================"

          java -version
          javac -version

          echo ""
          echo "JAVA_HOME=$JAVA_HOME"

          echo ""
          echo "========================================"
          echo "ANDROID"
          echo "========================================"

          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

      # ============================================
      # SYSTEM DEPENDENCIES
      # ============================================
      - name: Install system dependencies
        shell: bash
        run: |
          set -e

          sudo apt-get update

          sudo apt-get install -y \
            build-essential \
            git \
            zip \
            unzip \
            wget \
            curl \
            autoconf \
            automake \
            autopoint \
            ccache \
            cmake \
            libffi-dev \
            libltdl-dev \
            libssl-dev \
            libtool \
            make \
            patch \
            pkg-config \
            patchelf \
            gettext

      # ============================================
      # ANDROID SDK
      # ============================================
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      # ============================================
      # ANDROID PACKAGES
      # ============================================
      - name: Install Android SDK packages
        shell: bash
        run: |
          set -e

          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" \
            -type f \
            -name sdkmanager \
            -print \
            -quit)"

          if [ -z "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager not found."
            exit 1
          fi

          echo "Using sdkmanager:"
          echo "$SDKMANAGER"

          yes | "$SDKMANAGER" --licenses > /dev/null || true

          "$SDKMANAGER" \
            --sdk_root="$ANDROID_HOME" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      # ============================================
      # VERIFY AIDL
      # ============================================
      - name: Verify AIDL
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "ANDROID SDK CHECK"
          echo "========================================"

          test -d "$ANDROID_HOME/platforms/android-35"
          test -d "$ANDROID_HOME/build-tools/35.0.0"

          AIDL="$ANDROID_HOME/build-tools/35.0.0/aidl"

          if [ ! -x "$AIDL" ]; then
            echo "ERROR: AIDL not found:"
            echo "$AIDL"
            exit 1
          fi

          "$AIDL" --help > /dev/null

          echo "AIDL is working."

      # ============================================
      # INSTALL BUILD TOOLS
      # ============================================
      - name: Install Python build tools
        shell: bash
        run: |
          set -e

          python -m pip install --upgrade \
            "pip<25"

          python -m pip install \
            "setuptools<81" \
            "wheel" \
            "virtualenv" \
            "buildozer==1.6.0"

          echo ""
          echo "Python:"
          python --version

          echo ""
          echo "pip:"
          python -m pip --version

          echo ""
          echo "Buildozer:"
          buildozer --version

      # ============================================
      # CHECK BUILD SPEC
      # ============================================
      - name: Validate buildozer.spec
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "BUILDOZER SPEC"
          echo "========================================"

          if [ ! -f buildozer.spec ]; then
            echo "ERROR: buildozer.spec not found."
            exit 1
          fi

          cat buildozer.spec

          echo ""
          echo "Requirements:"
          grep -E \
            '^[[:space:]]*requirements[[:space:]]*=' \
            buildozer.spec || true

      # ============================================
      # CLEAN OLD BUILDOZER STATE
      # ============================================
      - name: Clean Buildozer environment
        shell: bash
        run: |
          set -e

          echo "Cleaning previous Buildozer state..."

          rm -rf "$HOME/.buildozer"
          rm -rf ".buildozer"
          rm -rf "bin"

          echo "Clean complete."

      # ============================================
      # FORCE BUILDOZER TO USE PYTHON 3.12
      # ============================================
      - name: Prepare Buildozer Python environment
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "PYTHON TOOLCHAIN"
          echo "========================================"

          PYTHON_BIN="$(command -v python)"

          echo "Python executable:"
          echo "$PYTHON_BIN"

          python --version

          echo ""
          echo "Python paths:"
          which python
          which python3
          which pip

          echo ""
          echo "Python 3.14 search:"
          find "$HOME/.buildozer" \
            -type f \
            -name python3.14 \
            -o -name python3.14* \
            2>/dev/null || true

          echo ""
          echo "Buildozer will use:"
          echo "$PYTHON_BIN"

      # ============================================
      # BUILD APK
      # ============================================
      - name: Build APK
        shell: bash
        env:
          PYTHONNOUSERSITE: "1"
          PIP_DISABLE_PIP_VERSION_CHECK: "1"
          PIP_NO_INPUT: "1"
        run: |
          set -e

          echo "========================================"
          echo "FINAL BUILD ENVIRONMENT"
          echo "========================================"

          echo "Python:"
          python --version

          echo ""
          python -c "import sys; print(sys.executable)"

          echo ""
          echo "pip:"
          python -m pip --version

          echo ""
          echo "Buildozer:"
          buildozer --version

          echo ""
          echo "Java:"
          java -version

          echo ""
          echo "Android SDK:"
          echo "$ANDROID_HOME"

          echo ""
          echo "========================================"
          echo "STARTING BUILD"
          echo "========================================"

          buildozer -v android debug

      # ============================================
      # VERIFY APK
      # ============================================
      - name: Verify APK
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "APK CHECK"
          echo "========================================"

          find . \
            -type f \
            -name "*.apk" \
            -print

          APK_COUNT=$(find . -type f -name "*.apk" | wc -l)

          if [ "$APK_COUNT" -eq 0 ]; then
            echo "ERROR: No APK was created."
            exit 1
          fi

          echo ""
          echo "APK COUNT: $APK_COUNT"
          echo "APK successfully created."

      # ============================================
      # UPLOAD APK
      # ============================================
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: weatherapp-apk
          path: bin/*.apk
          if-no-files-found: error