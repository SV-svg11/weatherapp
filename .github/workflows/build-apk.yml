name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:

      # --------------------------------
      # Checkout
      # --------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # --------------------------------
      # Python 3.12
      # --------------------------------
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # --------------------------------
      # Java 17
      # --------------------------------
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # --------------------------------
      # Verify Java
      # --------------------------------
      - name: Verify Java
        run: |
          echo "JAVA_HOME=$JAVA_HOME"
          java -version
          javac -version

      # --------------------------------
      # System dependencies
      # --------------------------------
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            git \
            zip \
            unzip \
            wget \
            curl \
            autoconf \
            automake \
            autopoint \
            ccache \
            cmake \
            libffi-dev \
            libltdl-dev \
            libssl-dev \
            libtool \
            make \
            patch \
            pkg-config

      # --------------------------------
      # Android SDK
      # --------------------------------
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      # --------------------------------
      # Accept Android SDK licenses
      # --------------------------------
      - name: Accept Android SDK licenses
        run: |
          yes | sdkmanager --licenses > /dev/null || true

      # --------------------------------
      # Install Android SDK packages
      # --------------------------------
      - name: Install Android SDK packages
        run: |
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-35"
          sdkmanager "build-tools;35.0.0"

      # --------------------------------
      # Verify Android SDK
      # --------------------------------
      - name: Verify Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

          echo ""
          echo "Java:"
          java -version

          echo ""
          echo "SDK:"
          ls -la "$ANDROID_HOME"

          echo ""
          echo "Build Tools:"
          ls -la "$ANDROID_HOME/build-tools/35.0.0"

          echo ""
          echo "AIDL:"
          test -x "$ANDROID_HOME/build-tools/35.0.0/aidl"
          "$ANDROID_HOME/build-tools/35.0.0/aidl" --help > /dev/null

          echo "AIDL is working."

      # --------------------------------
      # Install Buildozer
      # --------------------------------
      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip
          python -m pip install buildozer==1.6.0
          python -m pip install cython==0.29.37

      # --------------------------------
      # Configure Buildozer
      # --------------------------------
      - name: Configure Buildozer
        run: |
          mkdir -p "$HOME/.buildozer/android/platform"

          # Remove any old Buildozer SDK
          rm -rf "$HOME/.buildozer/android/platform/android-sdk"

          # Link Buildozer directly to GitHub's Android SDK
          ln -s "$ANDROID_HOME" \
            "$HOME/.buildozer/android/platform/android-sdk"

          # Remove obsolete Android SDK tools
          rm -rf \
            "$HOME/.buildozer/android/platform/android-sdk/tools"

          echo ""
          echo "Buildozer platform directory:"
          ls -la "$HOME/.buildozer/android/platform"

          echo ""
          echo "Buildozer SDK:"
          ls -la \
            "$HOME/.buildozer/android/platform/android-sdk"

          echo ""
          echo "Modern sdkmanager:"
          command -v sdkmanager
          sdkmanager --version

          echo ""
          echo "AIDL:"
          test -x \
            "$HOME/.buildozer/android/platform/android-sdk/build-tools/35.0.0/aidl"

          "$HOME/.buildozer/android/platform/android-sdk/build-tools/35.0.0/aidl" \
            --help > /dev/null

          echo "Buildozer SDK configuration is ready."

      # --------------------------------
      # Build APK
      # --------------------------------
      - name: Build APK
        env:
          JAVA_HOME: ${{ env.JAVA_HOME }}
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
          ANDROID_SDK_ROOT: ${{ env.ANDROID_SDK_ROOT }}
        run: |
          echo "JAVA_HOME=$JAVA_HOME"
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

          java -version

          echo ""
          echo "Starting Buildozer..."
          buildozer -v android debug

      # --------------------------------
      # Upload APK
      # --------------------------------
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: weatherapp-apk
          path: bin/*.apk
          if-no-files-found: error