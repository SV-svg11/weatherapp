name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      # --------------------------------
      # Checkout
      # --------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # --------------------------------
      # Python
      # --------------------------------
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # --------------------------------
      # Java 17
      # IMPORTANT: must happen BEFORE
      # Android SDK setup
      # --------------------------------
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # --------------------------------
      # Verify Java
      # --------------------------------
      - name: Verify Java
        run: |
          echo "JAVA_HOME=$JAVA_HOME"
          java -version
          javac -version

      # --------------------------------
      # System dependencies
      # --------------------------------
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            git \
            zip \
            unzip \
            wget \
            curl \
            autoconf \
            automake \
            autopoint \
            ccache \
            cmake \
            libffi-dev \
            libltdl-dev \
            libssl-dev \
            libtool \
            make \
            patch \
            pkg-config

      # --------------------------------
      # Android SDK
      # --------------------------------
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      # --------------------------------
      # Accept Android licenses
      # --------------------------------
      - name: Accept Android SDK licenses
        run: |
          yes | sdkmanager --licenses || true

      # --------------------------------
      # Install Android packages
      # --------------------------------
      - name: Install Android SDK packages
        run: |
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-35"
          sdkmanager "build-tools;35.0.0"

      # --------------------------------
      # Verify Android SDK + AIDL
      # --------------------------------
            - name: Verify Android SDK
        	run: |
          	echo "ANDROID_HOME=$ANDROID_HOME"
          	echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

          	echo "Java:"
          	java -version

          	echo "Installed Build Tools:"
          	ls -la "$ANDROID_HOME/build-tools"

          	echo "Checking AIDL:"
          	test -f "$ANDROID_HOME/build-tools/35.0.0/aidl"

          	echo "AIDL executable found:"
          	ls -lh "$ANDROID_HOME/build-tools/35.0.0/aidl"

          	echo "AIDL help check:"
          "$ANDROID_HOME/build-tools/35.0.0/aidl" --help > /dev/null
          	echo "AIDL is installed and executable."

      # --------------------------------
      # Install Buildozer
      # --------------------------------
      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip
          python -m pip install buildozer==1.6.0
          python -m pip install cython==0.29.37

      # --------------------------------
      # Connect Buildozer to GitHub SDK
      # --------------------------------
      - name: Configure Buildozer Android SDK
        run: |
          mkdir -p "$HOME/.buildozer/android/platform"

          rm -rf "$HOME/.buildozer/android/platform/android-sdk"

          ln -s "$ANDROID_HOME" \
            "$HOME/.buildozer/android/platform/android-sdk"

          echo "Buildozer Android platform:"
          ls -la "$HOME/.buildozer/android/platform"

          echo "Buildozer SDK:"
          ls -la "$HOME/.buildozer/android/platform/android-sdk"

          echo "Buildozer AIDL:"
          test -f "$HOME/.buildozer/android/platform/android-sdk/build-tools/35.0.0/aidl"

                    "$HOME/.buildozer/android/platform/android-sdk/build-tools/35.0.0/aidl" --help > /dev/null
          echo "Buildozer can access AIDL successfully."

      # --------------------------------
      # Build APK
      # --------------------------------
      - name: Build APK
        run: |
          buildozer -v android debug

      # --------------------------------
      # Upload APK
      # --------------------------------
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: weatherapp-apk
          path: bin/*.apk
          if-no-files-found: error