name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-22.04

    env:
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      PIP_NO_INPUT: "1"

    steps:

      # ============================================
      # CHECKOUT
      # ============================================
      - name: Checkout repository
        uses: actions/checkout@v4

      # ============================================
      # PYTHON 3.14
      #
      # p4a develop is intended for Python 3.14
      # ============================================
      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      # ============================================
      # JAVA 17
      # ============================================
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # ============================================
      # VERIFY JAVA / PYTHON
      # ============================================
      - name: Verify Python and Java
        run: |
          echo "========================================"
          echo "PYTHON"
          echo "========================================"

          python --version
          python -m pip --version

          echo ""
          echo "========================================"
          echo "JAVA"
          echo "========================================"

          echo "JAVA_HOME=$JAVA_HOME"
          java -version
          javac -version

      # ============================================
      # SYSTEM DEPENDENCIES
      # ============================================
      - name: Install system dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            build-essential \
            git \
            zip \
            unzip \
            wget \
            curl \
            autoconf \
            automake \
            autopoint \
            ccache \
            cmake \
            libffi-dev \
            libltdl-dev \
            libssl-dev \
            libtool \
            make \
            patch \
            pkg-config \
            patchelf \
            gettext

      # ============================================
      # ANDROID SDK
      # ============================================
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      # ============================================
      # FIND SDKMANAGER
      # ============================================
      - name: Detect Android SDK manager
        shell: bash
        run: |
          set -e

          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" \
            -type f \
            -name sdkmanager \
            -print \
            -quit)"

          if [ -z "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager not found"
            find "$ANDROID_HOME/cmdline-tools" \
              -maxdepth 5 \
              -type f \
              -print || true
            exit 1
          fi

          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"

          echo ""
          echo "sdkmanager:"
          echo "$SDKMANAGER"

          echo ""
          "$SDKMANAGER" --version

      # ============================================
      # ACCEPT LICENSES
      # ============================================
      - name: Accept Android SDK licenses
        shell: bash
        run: |
          yes | "$SDKMANAGER" --licenses > /dev/null || true

      # ============================================
      # INSTALL SDK
      # ============================================
      - name: Install Android SDK packages
        shell: bash
        run: |
          set -e

          echo "Installing platform-tools..."

          "$SDKMANAGER" \
            --sdk_root="$ANDROID_HOME" \
            "platform-tools"

          echo ""
          echo "Installing Android API 35..."

          "$SDKMANAGER" \
            --sdk_root="$ANDROID_HOME" \
            "platforms;android-35"

          echo ""
          echo "Installing Build Tools 35.0.0..."

          "$SDKMANAGER" \
            --sdk_root="$ANDROID_HOME" \
            "build-tools;35.0.0"

          echo ""
          echo "SDK installation completed."

      # ============================================
      # VERIFY SDK
      # ============================================
      - name: Verify Android SDK
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "ANDROID SDK VERIFICATION"
          echo "========================================"

          echo "ANDROID_HOME=$ANDROID_HOME"

          echo ""
          echo "Platform tools:"
          ls -la "$ANDROID_HOME/platform-tools"

          echo ""
          echo "Android 35:"
          ls -la "$ANDROID_HOME/platforms/android-35"

          echo ""
          echo "Build tools:"
          ls -la "$ANDROID_HOME/build-tools/35.0.0"

          echo ""
          echo "AIDL test:"

          test -x \
            "$ANDROID_HOME/build-tools/35.0.0/aidl"

          "$ANDROID_HOME/build-tools/35.0.0/aidl" \
            --help > /dev/null

          echo "AIDL is working."

      # ============================================
      # INSTALL BUILDOZER
      #
      # Use a version compatible with the
      # current p4a/develop workflow.
      # ============================================
      - name: Install Buildozer
        shell: bash
        run: |
          set -e

          python -m pip install \
            "pip==25.3"

          python -m pip install \
            "buildozer==1.6.0"

          python -m pip install \
            "cython==0.29.34"

          python -m pip install \
            "setuptools<81" \
            "virtualenv" \
            "packaging"

          echo ""
          echo "Python:"
          python --version

          echo ""
          echo "pip:"
          python -m pip --version

          echo ""
          echo "Buildozer:"
          buildozer --version

          echo ""
          echo "Cython:"
          cython --version

      # ============================================
      # PREPARE BUILDOZER DIRECTORY
      # ============================================
      - name: Prepare Buildozer directories
        shell: bash
        run: |
          set -e

          rm -rf "$HOME/.buildozer"
          rm -rf ".buildozer"

          mkdir -p \
            "$HOME/.buildozer/android/platform"

      # ============================================
      # CONFIGURE SDK FOR BUILDOZER
      # ============================================
      - name: Configure Buildozer Android SDK
        shell: bash
        run: |
          set -e

          BUILDOZER_PLATFORM="$HOME/.buildozer/android/platform"
          BUILDOZER_SDK="$BUILDOZER_PLATFORM/android-sdk"

          rm -rf "$BUILDOZER_SDK"

          ln -s \
            "$ANDROID_HOME" \
            "$BUILDOZER_SDK"

          echo ""
          echo "Buildozer SDK:"
          ls -la "$BUILDOZER_PLATFORM"

          # Buildozer 1.6 compatibility path
          mkdir -p "$ANDROID_HOME/tools/bin"

          ln -sf \
            "$SDKMANAGER" \
            "$ANDROID_HOME/tools/bin/sdkmanager"

          mkdir -p "$BUILDOZER_SDK/tools/bin"

          ln -sf \
            "$SDKMANAGER" \
            "$BUILDOZER_SDK/tools/bin/sdkmanager"

          echo ""
          echo "Buildozer sdkmanager:"
          "$BUILDOZER_SDK/tools/bin/sdkmanager" --version

      # ============================================
      # FIX BUILDOZER SPEC
      #
      # Remove "android" from requirements if it
      # exists. p4a already has an Android recipe;
      # "android" must NOT be pip-installed as an
      # application requirement.
      # ============================================
      - name: Validate and fix buildozer.spec
        shell: bash
        run: |
          set -e

          if [ ! -f buildozer.spec ]; then
            echo "ERROR: buildozer.spec not found."
            exit 1
          fi

          echo "========================================"
          echo "ORIGINAL BUILD SPEC"
          echo "========================================"

          cat buildozer.spec

          echo ""
          echo "========================================"
          echo "REMOVING INVALID android REQUIREMENT"
          echo "========================================"

          # Remove android from a normal comma-separated
          # requirements line.
          sed -i -E \
            's/(^|,)[[:space:]]*android[[:space:]]*(,|$)/\1\2/g' \
            buildozer.spec

          # Clean up double commas created by the removal.
          sed -i -E \
            's/,[[:space:]]*,+/,/g' \
            buildozer.spec

          # Remove leading/trailing commas from requirements.
          sed -i -E \
            's/^([[:space:]]*requirements[[:space:]]*=[[:space:]]*),+/\1/' \
            buildozer.spec

          sed -i -E \
            's/,+[[:space:]]*$/ /' \
            buildozer.spec

          echo ""
          echo "========================================"
          echo "UPDATED BUILD SPEC"
          echo "========================================"

          cat buildozer.spec

      # ============================================
      # FORCE p4a DEVELOP BRANCH
      #
      # Buildozer will use this branch for the
      # Android toolchain.
      # ============================================
      - name: Configure python-for-android develop
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "CONFIGURE p4a DEVELOP"
          echo "========================================"

          if grep -qE '^[[:space:]]*p4a\.branch[[:space:]]*=' buildozer.spec; then

            sed -i -E \
              's/^[[:space:]]*p4a\.branch[[:space:]]*=.*/p4a.branch = develop/' \
              buildozer.spec

          else

            cat >> buildozer.spec <<'EOF'

          # Python-for-Android branch for Python 3.14
          p4a.branch = develop
          EOF

          fi

          echo ""
          echo "p4a configuration:"
          grep -n "p4a.branch" buildozer.spec || true

      # ============================================
      # SHOW FINAL CONFIG
      # ============================================
      - name: Show final Buildozer configuration
        shell: bash
        run: |
          echo "========================================"
          echo "FINAL BUILDOZER SPEC"
          echo "========================================"

          cat buildozer.spec

          echo ""
          echo "========================================"
          echo "CHECK FOR INVALID android REQUIREMENT"
          echo "========================================"

          if grep -E \
            '^[[:space:]]*requirements[[:space:]]*=' \
            buildozer.spec | grep -E '(^|,)android(,|$)'; then

            echo "ERROR: android is still in requirements."
            exit 1

          fi

          echo "No invalid android requirement found."

      # ============================================
      # BUILD APK
      # ============================================
      - name: Build APK
        shell: bash
        env:
          JAVA_HOME: ${{ env.JAVA_HOME }}
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
          ANDROID_SDK_ROOT: ${{ env.ANDROID_SDK_ROOT }}

        run: |
          set -e

          echo "========================================"
          echo "BUILD ENVIRONMENT"
          echo "========================================"

          echo ""
          echo "Python:"
          python --version

          echo ""
          echo "pip:"
          python -m pip --version

          echo ""
          echo "Buildozer:"
          buildozer --version

          echo ""
          echo "Java:"
          java -version

          echo ""
          echo "JAVA_HOME:"
          echo "$JAVA_HOME"

          echo ""
          echo "ANDROID_HOME:"
          echo "$ANDROID_HOME"

          echo ""
          echo "========================================"
          echo "STARTING BUILDOZER"
          echo "========================================"

          buildozer -v android debug

      # ============================================
      # VERIFY APK
      # ============================================
      - name: Verify APK
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "APK SEARCH"
          echo "========================================"

          find . \
            -type f \
            -name "*.apk" \
            -print

          APK_COUNT=$(find . -type f -name "*.apk" | wc -l)

          if [ "$APK_COUNT" -eq 0 ]; then
            echo ""
            echo "ERROR: No APK was created."
            exit 1
          fi

          echo ""
          echo "APK COUNT: $APK_COUNT"
          echo "APK successfully created."

      # ============================================
      # UPLOAD APK
      # ============================================
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: weatherapp-apk
          path: bin/*.apk
          if-no-files-found: error