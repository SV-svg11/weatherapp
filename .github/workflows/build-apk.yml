name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:

      # ========================================
      # CHECKOUT
      # ========================================
      - name: Checkout repository
        uses: actions/checkout@v4

      # ========================================
      # PYTHON
      # ========================================
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # ========================================
      # JAVA 17
      # ========================================
      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # ========================================
      # VERIFY JAVA
      # ========================================
      - name: Verify Java
        run: |
          echo "========================================"
          echo "JAVA"
          echo "========================================"

          echo "JAVA_HOME=$JAVA_HOME"

          java -version
          javac -version
          keytool -help > /dev/null

      # ========================================
      # SYSTEM DEPENDENCIES
      # ========================================
      - name: Install system dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            build-essential \
            git \
            zip \
            unzip \
            wget \
            curl \
            autoconf \
            automake \
            autopoint \
            ccache \
            cmake \
            libffi-dev \
            libltdl-dev \
            libssl-dev \
            libtool \
            make \
            patch \
            pkg-config

      # ========================================
      # ANDROID SDK
      # ========================================
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      # ========================================
      # FIND SDKMANAGER
      # ========================================
      - name: Detect Android SDK manager
        shell: bash
        run: |

          set -e

          echo "========================================"
          echo "ANDROID SDK"
          echo "========================================"

          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

          echo ""
          echo "Searching for sdkmanager..."

          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" \
            -type f \
            -name sdkmanager \
            -print \
            -quit)"

          if [ -z "$SDKMANAGER" ]; then
            echo ""
            echo "ERROR: sdkmanager was not found."

            echo ""
            echo "Android SDK contents:"
            find "$ANDROID_HOME/cmdline-tools" \
              -maxdepth 5 \
              -type f \
              -print || true

            exit 1
          fi

          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"

          echo ""
          echo "Found sdkmanager:"
          echo "$SDKMANAGER"

          echo ""
          echo "sdkmanager version:"
          "$SDKMANAGER" --version

      # ========================================
      # ACCEPT LICENSES
      # ========================================
      - name: Accept Android SDK licenses
        shell: bash
        run: |

          set -e

          yes | "$SDKMANAGER" --licenses > /dev/null || true

          echo "Android SDK licenses processed."

      # ========================================
      # INSTALL ANDROID SDK PACKAGES
      # ========================================
      - name: Install Android SDK packages
        shell: bash
        run: |

          set -e

          echo "========================================"
          echo "INSTALLING ANDROID SDK PACKAGES"
          echo "========================================"

          echo ""
          echo "Installing platform-tools..."

          "$SDKMANAGER" \
            --sdk_root="$ANDROID_HOME" \
            "platform-tools"

          echo ""
          echo "Installing Android 35..."

          "$SDKMANAGER" \
            --sdk_root="$ANDROID_HOME" \
            "platforms;android-35"

          echo ""
          echo "Installing Build Tools 35..."

          "$SDKMANAGER" \
            --sdk_root="$ANDROID_HOME" \
            "build-tools;35.0.0"

          echo ""
          echo "Android SDK packages installed."

      # ========================================
      # VERIFY ANDROID SDK
      # ========================================
      - name: Verify Android SDK and AIDL
        shell: bash
        run: |

          set -e

          echo "========================================"
          echo "VERIFY ANDROID SDK"
          echo "========================================"

          echo ""
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

          echo ""
          echo "SDKMANAGER:"
          "$SDKMANAGER" --version

          echo ""
          echo "Installed platform tools:"
          ls -la "$ANDROID_HOME/platform-tools"

          echo ""
          echo "Android 35:"
          ls -la "$ANDROID_HOME/platforms/android-35"

          echo ""
          echo "Build Tools:"
          ls -la "$ANDROID_HOME/build-tools/35.0.0"

          echo ""
          echo "AIDL:"
          test -x "$ANDROID_HOME/build-tools/35.0.0/aidl"

          "$ANDROID_HOME/build-tools/35.0.0/aidl" \
            --help > /dev/null

          echo ""
          echo "AIDL is working."

      # ========================================
      # INSTALL BUILDOZER
      # ========================================
      - name: Install Buildozer
        shell: bash
        run: |

          set -e

          echo "========================================"
          echo "INSTALL BUILDOZER"
          echo "========================================"

          python -m pip install --upgrade "pip<26"

          python -m pip install \
            buildozer==1.6.0

          python -m pip install \
            cython==0.29.37

          python -m pip install \
            setuptools \
            virtualenv

          echo ""
          echo "Python:"
          python --version

          echo ""
          echo "Pip:"
          python -m pip --version

          echo ""
          echo "Cython:"
          cython --version

          echo ""
          echo "Buildozer:"
          buildozer --version

      # ========================================
      # CLEAN BUILDOZER
      # ========================================
      - name: Clean Buildozer environment
        shell: bash
        run: |

          set -e

          echo "========================================"
          echo "CLEAN BUILDOZER ENVIRONMENT"
          echo "========================================"

          rm -rf "$HOME/.buildozer"
          rm -rf ".buildozer"

          mkdir -p "$HOME/.buildozer/android/platform"

          echo "Buildozer environment cleaned."

      # ========================================
      # CONFIGURE BUILDOZER SDK
      # ========================================
      - name: Configure Buildozer Android SDK
        shell: bash
        run: |

          set -e

          echo "========================================"
          echo "CONFIGURE BUILDOZER SDK"
          echo "========================================"

          BUILDOZER_PLATFORM="$HOME/.buildozer/android/platform"
          BUILDOZER_SDK="$BUILDOZER_PLATFORM/android-sdk"

          mkdir -p "$BUILDOZER_PLATFORM"

          echo ""
          echo "GitHub Android SDK:"
          echo "$ANDROID_HOME"

          echo ""
          echo "Buildozer SDK:"
          echo "$BUILDOZER_SDK"

          # ----------------------------------------
          # Link Buildozer SDK to GitHub SDK
          # ----------------------------------------

          rm -rf "$BUILDOZER_SDK"

          ln -s "$ANDROID_HOME" "$BUILDOZER_SDK"

          echo ""
          echo "Buildozer SDK link:"
          ls -la "$BUILDOZER_PLATFORM"

          # ----------------------------------------
          # Buildozer expects old sdkmanager path:
          #
          # android-sdk/tools/bin/sdkmanager
          #
          # Create compatibility link.
          # ----------------------------------------

          mkdir -p "$ANDROID_HOME/tools/bin"

          ln -sf \
            "$SDKMANAGER" \
            "$ANDROID_HOME/tools/bin/sdkmanager"

          echo ""
          echo "Compatibility sdkmanager:"
          ls -lh "$ANDROID_HOME/tools/bin/sdkmanager"

          echo ""
          echo "Compatibility sdkmanager version:"
          "$ANDROID_HOME/tools/bin/sdkmanager" --version

          # ----------------------------------------
          # Same compatibility path through
          # Buildozer SDK.
          # ----------------------------------------

          mkdir -p "$BUILDOZER_SDK/tools/bin"

          ln -sf \
            "$SDKMANAGER" \
            "$BUILDOZER_SDK/tools/bin/sdkmanager"

          echo ""
          echo "Buildozer sdkmanager:"
          ls -lh "$BUILDOZER_SDK/tools/bin/sdkmanager"

          echo ""
          echo "Buildozer sdkmanager version:"
          "$BUILDOZER_SDK/tools/bin/sdkmanager" --version

          # ----------------------------------------
          # AIDL
          # ----------------------------------------

          echo ""
          echo "Testing AIDL..."

          test -x \
            "$BUILDOZER_SDK/build-tools/35.0.0/aidl"

          "$BUILDOZER_SDK/build-tools/35.0.0/aidl" \
            --help > /dev/null

          echo ""
          echo "AIDL is working."

          echo ""
          echo "Buildozer Android SDK is ready."

      # ========================================
      # TEST BUILDOZER SDKMANAGER
      #
      # IMPORTANT:
      # This catches sdkmanager errors BEFORE
      # the long Android build starts.
      # ========================================
      - name: Test Buildozer sdkmanager
        shell: bash
        run: |

          set -e

          echo "========================================"
          echo "TEST BUILDOZER SDKMANAGER"
          echo "========================================"

          SDK="$HOME/.buildozer/android/platform/android-sdk"

          echo ""
          echo "SDK=$SDK"

          echo ""
          echo "sdkmanager:"
          "$SDK/tools/bin/sdkmanager" --version

          echo ""
          echo "Checking installed packages..."

          "$SDK/tools/bin/sdkmanager" \
            --sdk_root="$SDK" \
            --list_installed || true

          echo ""
          echo "Testing platform-tools..."

          "$SDK/tools/bin/sdkmanager" \
            --sdk_root="$SDK" \
            --verbose \
            "platform-tools"

          echo ""
          echo "platform-tools test completed successfully."

      # ========================================
      # SHOW BUILDOZER SPEC
      # ========================================
      - name: Show Buildozer configuration
        shell: bash
        run: |

          echo "========================================"
          echo "BUILDOZER SPEC"
          echo "========================================"

          if [ ! -f buildozer.spec ]; then
            echo ""
            echo "ERROR: buildozer.spec not found."
            exit 1
          fi

          cat buildozer.spec

      # ========================================
      # BUILD APK
      # ========================================
      - name: Build APK
        shell: bash
        env:
          JAVA_HOME: ${{ env.JAVA_HOME }}
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
          ANDROID_SDK_ROOT: ${{ env.ANDROID_SDK_ROOT }}
          PYTHONDONTWRITEBYTECODE: "1"

        run: |

          set -e

          echo "========================================"
          echo "BUILD ENVIRONMENT"
          echo "========================================"

          echo ""
          echo "Python:"
          python --version

          echo ""
          echo "Pip:"
          python -m pip --version

          echo ""
          echo "Buildozer:"
          buildozer --version

          echo ""
          echo "Java:"
          java -version

          echo ""
          echo "JAVA_HOME:"
          echo "$JAVA_HOME"

          echo ""
          echo "ANDROID_HOME:"
          echo "$ANDROID_HOME"

          echo ""
          echo "ANDROID_SDK_ROOT:"
          echo "$ANDROID_SDK_ROOT"

          echo ""
          echo "========================================"
          echo "STARTING BUILDOZER"
          echo "========================================"

          buildozer -v android debug

      # ========================================
      # VERIFY APK
      # ========================================
      - name: Verify APK
        shell: bash
        run: |

          set -e

          echo "========================================"
          echo "SEARCHING FOR APK"
          echo "========================================"

          find . \
            -type f \
            -name "*.apk" \
            -print

          APK_COUNT=$(find . -type f -name "*.apk" | wc -l)

          if [ "$APK_COUNT" -eq 0 ]; then
            echo ""
            echo "ERROR: APK was not created."
            exit 1
          fi

          echo ""
          echo "APK COUNT: $APK_COUNT"
          echo ""
          echo "APK successfully created."

      # ========================================
      # UPLOAD APK
      # ========================================
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: weatherapp-apk
          path: bin/*.apk
          if-no-files-found: error