```yaml
name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:

      # --------------------------------
      # Checkout
      # --------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # --------------------------------
      # Python 3.12
      # --------------------------------
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # --------------------------------
      # Java 17
      # --------------------------------
      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # --------------------------------
      # Verify Java
      # --------------------------------
      - name: Verify Java
        run: |
          echo "JAVA_HOME=$JAVA_HOME"
          java -version
          javac -version

      # --------------------------------
      # System dependencies
      # --------------------------------
      - name: Install system dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            build-essential \
            git \
            zip \
            unzip \
            wget \
            curl \
            autoconf \
            automake \
            autopoint \
            ccache \
            cmake \
            libffi-dev \
            libltdl-dev \
            libssl-dev \
            libtool \
            make \
            patch \
            pkg-config

      # --------------------------------
      # Android SDK
      # --------------------------------
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      # --------------------------------
      # Accept Android SDK licenses
      # --------------------------------
      - name: Accept Android SDK licenses
        run: |
          yes | sdkmanager --licenses > /dev/null || true

      # --------------------------------
      # Install Android SDK packages
      # --------------------------------
      - name: Install Android SDK packages
        run: |
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-35"
          sdkmanager "build-tools;35.0.0"

      # --------------------------------
      # Verify Android SDK and AIDL
      # --------------------------------
      - name: Verify Android SDK
        run: |
          echo "========================================"
          echo "ANDROID SDK VERIFICATION"
          echo "========================================"

          echo ""
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

          echo ""
          echo "Java:"
          java -version

          echo ""
          echo "Android SDK:"
          ls -la "$ANDROID_HOME"

          echo ""
          echo "Command line tools:"
          find "$ANDROID_HOME/cmdline-tools" \
            -maxdepth 4 \
            -type f \
            -name sdkmanager \
            -print

          echo ""
          echo "Build Tools:"
          ls -la "$ANDROID_HOME/build-tools/35.0.0"

          echo ""
          echo "AIDL:"
          test -x "$ANDROID_HOME/build-tools/35.0.0/aidl"

          "$ANDROID_HOME/build-tools/35.0.0/aidl" \
            --help > /dev/null

          echo ""
          echo "AIDL is working."

      # --------------------------------
      # Install Buildozer
      # --------------------------------
      - name: Install Buildozer
        run: |
          python -m pip install --upgrade "pip<26"

          python -m pip install \
            buildozer==1.6.0

          python -m pip install \
            cython==0.29.37

          python -m pip install \
            setuptools \
            virtualenv

          echo ""
          echo "========================================"
          echo "PYTHON BUILD ENVIRONMENT"
          echo "========================================"

          python --version
          python -m pip --version
          buildozer --version

      # --------------------------------
      # Clean Buildozer environment
      #
      # Removes the previous broken:
      # .buildozer/.../build/venv
      # --------------------------------
      - name: Clean Buildozer environment
        run: |
          echo "Cleaning Buildozer environment..."

          rm -rf "$HOME/.buildozer"
          rm -rf ".buildozer"

          mkdir -p "$HOME/.buildozer/android/platform"

          echo ""
          echo "Buildozer environment cleaned."

      # --------------------------------
      # Configure Buildozer Android SDK
      #
      # IMPORTANT:
      # Do NOT assume cmdline-tools/16.0.
      # Find the actual sdkmanager dynamically.
      # --------------------------------
      - name: Configure Buildozer Android SDK
        shell: bash
        run: |

          set -e

          echo "========================================"
          echo "CONFIGURING BUILDOZER ANDROID SDK"
          echo "========================================"

          echo ""
          echo "ANDROID_HOME:"
          echo "$ANDROID_HOME"

          echo ""
          echo "ANDROID_SDK_ROOT:"
          echo "$ANDROID_SDK_ROOT"

          # --------------------------------
          # Find real sdkmanager
          # --------------------------------
          echo ""
          echo "Searching for sdkmanager..."

          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" \
            -type f \
            -name sdkmanager \
            -print \
            -quit)"

          if [ -z "$SDKMANAGER" ]; then

            echo ""
            echo "ERROR: sdkmanager was not found."

            echo ""
            echo "Contents of Android SDK:"
            find "$ANDROID_HOME" \
              -maxdepth 5 \
              -type f \
              \( -name sdkmanager -o -name aidl \) \
              -print || true

            exit 1
          fi

          echo ""
          echo "REAL SDKMANAGER:"
          echo "$SDKMANAGER"

          echo ""
          echo "SDKMANAGER VERSION:"
          "$SDKMANAGER" --version

          # --------------------------------
          # Buildozer SDK path
          # --------------------------------
          BUILDOZER_PLATFORM="$HOME/.buildozer/android/platform"
          BUILDOZER_SDK="$BUILDOZER_PLATFORM/android-sdk"

          mkdir -p "$BUILDOZER_PLATFORM"

          # Remove any previous SDK link
          rm -rf "$BUILDOZER_SDK"

          # Link Buildozer to GitHub Actions Android SDK
          ln -s "$ANDROID_HOME" "$BUILDOZER_SDK"

          echo ""
          echo "Buildozer SDK:"
          ls -la "$BUILDOZER_PLATFORM"

          echo ""
          echo "Buildozer Android SDK:"
          ls -la "$BUILDOZER_SDK"

          # --------------------------------
          # Buildozer compatibility path
          #
          # Buildozer expects:
          #
          # android-sdk/tools/bin/sdkmanager
          #
          # Modern Android SDK:
          #
          # android-sdk/cmdline-tools/<version>/bin/sdkmanager
          # --------------------------------
          echo ""
          echo "Creating Buildozer sdkmanager compatibility path..."

          mkdir -p "$ANDROID_HOME/tools/bin"

          ln -sf \
            "$SDKMANAGER" \
            "$ANDROID_HOME/tools/bin/sdkmanager"

          echo ""
          echo "Compatibility sdkmanager:"
          ls -lh "$ANDROID_HOME/tools/bin/sdkmanager"

          echo ""
          echo "Testing compatibility sdkmanager:"

          "$ANDROID_HOME/tools/bin/sdkmanager" --version

          # --------------------------------
          # Verify through Buildozer path
          # --------------------------------
          echo ""
          echo "Creating Buildozer compatibility path..."

          mkdir -p "$BUILDOZER_SDK/tools/bin"

          ln -sf \
            "$SDKMANAGER" \
            "$BUILDOZER_SDK/tools/bin/sdkmanager"

          echo ""
          echo "Buildozer sdkmanager:"
          ls -lh "$BUILDOZER_SDK/tools/bin/sdkmanager"

          echo ""
          echo "Testing Buildozer sdkmanager:"

          "$BUILDOZER_SDK/tools/bin/sdkmanager" --version

          # --------------------------------
          # Verify AIDL
          # --------------------------------
          echo ""
          echo "Testing AIDL..."

          AIDL="$ANDROID_HOME/build-tools/35.0.0/aidl"

          if [ ! -x "$AIDL" ]; then
            echo ""
            echo "ERROR: AIDL not found:"
            echo "$AIDL"
            exit 1
          fi

          "$AIDL" --help > /dev/null

          echo ""
          echo "AIDL is working."

          echo ""
          echo "========================================"
          echo "BUILDOZER ANDROID SDK IS READY"
          echo "========================================"

      # --------------------------------
      # Show Buildozer configuration
      # --------------------------------
      - name: Show Buildozer configuration
        run: |
          echo "========================================"
          echo "BUILDOZER SPECIFICATION"
          echo "========================================"

          if [ ! -f buildozer.spec ]; then
            echo ""
            echo "ERROR: buildozer.spec not found!"
            exit 1
          fi

          cat buildozer.spec

      # --------------------------------
      # Build APK
      # --------------------------------
      - name: Build APK
        env:
          JAVA_HOME: ${{ env.JAVA_HOME }}
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
          ANDROID_SDK_ROOT: ${{ env.ANDROID_SDK_ROOT }}
          PYTHONDONTWRITEBYTECODE: "1"

        run: |

          echo "========================================"
          echo "BUILD ENVIRONMENT"
          echo "========================================"

          echo ""
          echo "Python:"
          python --version

          echo ""
          echo "Pip:"
          python -m pip --version

          echo ""
          echo "Buildozer:"
          buildozer --version

          echo ""
          echo "Java:"
          java -version

          echo ""
          echo "JAVA_HOME:"
          echo "$JAVA_HOME"

          echo ""
          echo "ANDROID_HOME:"
          echo "$ANDROID_HOME"

          echo ""
          echo "ANDROID_SDK_ROOT:"
          echo "$ANDROID_SDK_ROOT"

          echo ""
          echo "========================================"
          echo "STARTING BUILDOZER"
          echo "========================================"

          buildozer -v android debug

      # --------------------------------
      # Verify APK
      # --------------------------------
      - name: Verify APK
        run: |

          echo "========================================"
          echo "SEARCHING FOR APK"
          echo "========================================"

          find . \
            -type f \
            -name "*.apk" \
            -print

          if ! find . -type f -name "*.apk" | grep -q ".apk"; then

            echo ""
            echo "ERROR: APK was not created."

            echo ""
            echo "bin directory:"
            ls -la bin/ 2>/dev/null || true

            exit 1
          fi

          echo ""
          echo "========================================"
          echo "APK SUCCESSFULLY CREATED"
          echo "========================================"

      # --------------------------------
      # Upload APK
      # --------------------------------
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: weatherapp-apk
          path: bin/*.apk
          if-no-files-found: error
```
