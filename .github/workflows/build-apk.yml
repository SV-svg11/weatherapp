```yaml
name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-22.04

    env:
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      PIP_NO_INPUT: "1"

      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

      # Prevent p4a/buildozer from accidentally using Python 3.13/3.14.
      P4A_BRANCH: master

    steps:

      # ============================================================
      # CHECKOUT
      # ============================================================
      - name: Checkout repository
        uses: actions/checkout@v4

      # ============================================================
      # PYTHON 3.12
      # ============================================================
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # ============================================================
      # JAVA 17
      # ============================================================
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # ============================================================
      # SYSTEM DEPENDENCIES
      # ============================================================
      - name: Install system dependencies
        shell: bash
        run: |
          set -e

          sudo apt-get update

          sudo apt-get install -y \
            build-essential \
            git \
            zip \
            unzip \
            wget \
            curl \
            autoconf \
            automake \
            autopoint \
            ccache \
            cmake \
            libffi-dev \
            libltdl-dev \
            libssl-dev \
            libtool \
            make \
            patch \
            pkg-config \
            patchelf \
            gettext

      # ============================================================
      # ANDROID SDK
      # ============================================================
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      # ============================================================
      # INSTALL MODERN ANDROID SDK COMPONENTS
      # ============================================================
      - name: Install Android SDK packages
        shell: bash
        run: |
          set -e

          SDKMANAGER="$ANDROID_HOME/cmdline-tools/16.0/bin/sdkmanager"

          echo "Checking sdkmanager..."
          test -x "$SDKMANAGER"

          echo "sdkmanager:"
          "$SDKMANAGER" --version

          echo "Accepting Android SDK licenses..."
          yes | "$SDKMANAGER" --licenses > /dev/null || true

          echo "Installing required Android SDK packages..."

          "$SDKMANAGER" \
            --sdk_root="$ANDROID_HOME" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      # ============================================================
      # VERIFY MODERN SDK
      # ============================================================
      - name: Verify Android SDK
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "ANDROID SDK"
          echo "========================================"

          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

          SDKMANAGER="$ANDROID_HOME/cmdline-tools/16.0/bin/sdkmanager"
          AIDL="$ANDROID_HOME/build-tools/35.0.0/aidl"

          echo ""
          echo "sdkmanager:"
          "$SDKMANAGER" --version

          echo ""
          echo "Checking platform..."
          test -d "$ANDROID_HOME/platforms/android-35"

          echo ""
          echo "Checking build-tools..."
          test -d "$ANDROID_HOME/build-tools/35.0.0"

          echo ""
          echo "Checking AIDL..."
          test -x "$AIDL"

          "$AIDL" --version || true

          echo ""
          echo "Android SDK verification successful."

      # ============================================================
      # INSTALL BUILDOZER
      # ============================================================
      - name: Install Buildozer
        shell: bash
        run: |
          set -e

          python -m pip install --upgrade pip

          python -m pip install \
            "buildozer==1.6.0"

          python -m pip install \
            "setuptools" \
            "virtualenv" \
            "cython==0.29.34"

          echo "========================================"
          echo "BUILD TOOLS"
          echo "========================================"

          python --version
          python -m pip --version
          cython --version
          buildozer --version

      # ============================================================
      # VERIFY BUILD SPEC
      # ============================================================
      - name: Validate buildozer.spec
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "BUILDOZER SPEC"
          echo "========================================"

          if [ ! -f buildozer.spec ]; then
            echo "ERROR: buildozer.spec not found."
            exit 1
          fi

          cat buildozer.spec

      # ============================================================
      # CLEAN BUILDOZER
      # ============================================================
      - name: Clean Buildozer environment
        shell: bash
        run: |
          set -e

          echo "Cleaning Buildozer state..."

          rm -rf "$HOME/.buildozer"
          rm -rf ".buildozer"
          rm -rf "bin"

          echo "Buildozer state cleaned."

      # ============================================================
      # PREPARE BUILDOZER SDK DIRECTORY
      #
      # IMPORTANT:
      # Do NOT create an android-sdk symlink here.
      # Buildozer must be allowed to initialize its Android platform
      # directory normally.
      # ============================================================
      - name: Prepare Buildozer environment
        shell: bash
        run: |
          set -e

          mkdir -p "$HOME/.buildozer/android/platform"

          echo "========================================"
          echo "BUILDOZER ENVIRONMENT"
          echo "========================================"

          echo "ANDROID_HOME:"
          echo "$ANDROID_HOME"

          echo ""
          echo "Android SDK contents:"
          ls -la "$ANDROID_HOME"

          echo ""
          echo "Modern cmdline-tools:"
          ls -la "$ANDROID_HOME/cmdline-tools/16.0/bin"

          echo ""
          echo "Build-tools:"
          ls -la "$ANDROID_HOME/build-tools/35.0.0"

      # ============================================================
      # BUILD APK
      # ============================================================
      - name: Build APK
        shell: bash
        env:
          JAVA_HOME: ${{ env.JAVA_HOME }}
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
          ANDROID_SDK_ROOT: ${{ env.ANDROID_SDK_ROOT }}
        run: |
          set -e

          echo "========================================"
          echo "BUILD ENVIRONMENT"
          echo "========================================"

          python --version
          python -m pip --version
          cython --version
          buildozer --version
          java -version

          echo ""
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

          echo ""
          echo "========================================"
          echo "STARTING BUILDOZER"
          echo "========================================"

          buildozer -v android debug

      # ============================================================
      # VERIFY APK
      # ============================================================
      - name: Verify APK
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "APK CHECK"
          echo "========================================"

          find . \
            -type f \
            -name "*.apk" \
            -print

          APK_COUNT=$(find . -type f -name "*.apk" | wc -l)

          if [ "$APK_COUNT" -eq 0 ]; then
            echo "ERROR: No APK was created."
            exit 1
          fi

          echo ""
          echo "APK COUNT: $APK_COUNT"
          echo "APK successfully created."

      # ============================================================
      # UPLOAD APK
      # ============================================================
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: weatherapp-apk
          path: bin/*.apk
          if-no-files-found: error
```
