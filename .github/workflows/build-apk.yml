name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:

      # --------------------------------
      # Checkout
      # --------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # --------------------------------
      # Python 3.12
      # --------------------------------
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # --------------------------------
      # Java 17
      # --------------------------------
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # --------------------------------
      # Verify Java
      # --------------------------------
      - name: Verify Java
        run: |
          echo "JAVA_HOME=$JAVA_HOME"
          java -version
          javac -version

      # --------------------------------
      # System dependencies
      # --------------------------------
      - name: Install system dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            build-essential \
            git \
            zip \
            unzip \
            wget \
            curl \
            autoconf \
            automake \
            autopoint \
            ccache \
            cmake \
            libffi-dev \
            libltdl-dev \
            libssl-dev \
            libtool \
            make \
            patch \
            pkg-config

      # --------------------------------
      # Android SDK
      # --------------------------------
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      # --------------------------------
      # Accept Android SDK licenses
      # --------------------------------
      - name: Accept Android SDK licenses
        run: |
          yes | sdkmanager --licenses > /dev/null || true

      # --------------------------------
      # Install Android SDK packages
      # --------------------------------
      - name: Install Android SDK packages
        run: |
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-35"
          sdkmanager "build-tools;35.0.0"

      # --------------------------------
      # Verify Android SDK
      # --------------------------------
      - name: Verify Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

          echo ""
          echo "Java:"
          java -version

          echo ""
          echo "Android SDK:"
          ls -la "$ANDROID_HOME"

          echo ""
          echo "Command-line tools:"
          find "$ANDROID_HOME/cmdline-tools" \
            -maxdepth 3 \
            -type f \
            -name sdkmanager \
            -print

          echo ""
          echo "Build Tools:"
          ls -la "$ANDROID_HOME/build-tools/35.0.0"

          echo ""
          echo "AIDL:"
          test -x "$ANDROID_HOME/build-tools/35.0.0/aidl"

          "$ANDROID_HOME/build-tools/35.0.0/aidl" \
            --help > /dev/null

          echo "AIDL is working."

      # --------------------------------
      # Install Buildozer
      # --------------------------------
      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip

          python -m pip install \
            buildozer==1.6.0

          python -m pip install \
            cython==0.29.37

      # --------------------------------
      # Configure Buildozer Android SDK
      # --------------------------------
      - name: Configure Buildozer Android SDK
        run: |

          mkdir -p "$HOME/.buildozer/android/platform"

          # Remove any previous Buildozer SDK
          rm -rf \
            "$HOME/.buildozer/android/platform/android-sdk"

          # Link Buildozer to GitHub Actions Android SDK
          ln -s "$ANDROID_HOME" \
            "$HOME/.buildozer/android/platform/android-sdk"

          SDK="$HOME/.buildozer/android/platform/android-sdk"

          echo ""
          echo "Buildozer platform:"
          ls -la "$HOME/.buildozer/android/platform"

          echo ""
          echo "Buildozer Android SDK:"
          ls -la "$SDK"

          echo ""
          echo "Modern sdkmanager:"
          command -v sdkmanager
          sdkmanager --version

          # --------------------------------
          # Buildozer 1.6.0 compatibility
          #
          # Buildozer expects:
          #   tools/bin/sdkmanager
          #
          # Modern Android SDK provides:
          #   cmdline-tools/16.0/bin/sdkmanager
          #
          # Create compatibility path.
          # --------------------------------

          mkdir -p "$SDK/tools/bin"

          ln -sf \
            "$SDK/cmdline-tools/16.0/bin/sdkmanager" \
            "$SDK/tools/bin/sdkmanager"

          echo ""
          echo "Compatibility sdkmanager:"
          ls -lh "$SDK/tools/bin/sdkmanager"

          echo ""
          echo "Testing Buildozer sdkmanager:"
          "$SDK/tools/bin/sdkmanager" --version

          echo ""
          echo "Testing AIDL:"
          test -x \
            "$SDK/build-tools/35.0.0/aidl"

          "$SDK/build-tools/35.0.0/aidl" \
            --help > /dev/null

          echo ""
          echo "Buildozer Android SDK is ready."

      # --------------------------------
      # Build APK
      # --------------------------------
      - name: Build APK
        env:
          JAVA_HOME: ${{ env.JAVA_HOME }}
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
          ANDROID_SDK_ROOT: ${{ env.ANDROID_SDK_ROOT }}
        run: |

          echo "JAVA_HOME=$JAVA_HOME"
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

          echo ""
          echo "Java:"
          java -version

          echo ""
          echo "Starting Buildozer..."
          buildozer -v android debug

      # --------------------------------
      # Upload APK
      # --------------------------------
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: weatherapp-apk
          path: bin/*.apk
          if-no-files-found: error